<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Facts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Country Facts</h1>

    <form id="searchForm">
      <label for="countryInput">Enter a country:</label>

      <div class="search-box">
        <input type="text" id="countryInput" placeholder="Ethiopia" value="Ethiopia" required>
        
        <button type="submit">Search</button>
        
      </div>
    </form>
    <section id="facts" aria-live="polite">Loading...</section>
  </main>
  <script src="app.js"></script>
</body>
</html>
