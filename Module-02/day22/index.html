<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birr Watch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <span class="brand-icon">▣</span>
                <span>Birr Watch</span>
            </div>
        </header>


        <!-- Main Content -->
        <section class="content">

            <!-- Converter Card -->
            <div class="converter-card">

                <!-- Inputs -->
                <div class="converter-inputs">

                    <div class="input-group">
                        <label for="amount">
                            Amount (ETB)
                        </label>

                        <input
                            type="number"
                            id="amount"
                            value="100"
                            min="0"
                            step="0.01"
                        >
                    </div>


                    <div class="swap-symbol">
                        ⇄
                    </div>


                    <div class="input-group">
                        <label for="currency">
                            To Currency
                        </label>

                        <select id="currency">
                            <option value="">Loading currencies...</option>
                        </select>
                    </div>

                </div>


                <!-- Result -->
                <div class="result-box">

                    <p id="conversion-result">
                        Loading...
                    </p>

                    <p id="rate-result">
                        Please wait
                    </p>

                </div>


                <!-- Actions -->
                <div class="actions">

                    <button
                        id="add-watchlist"
                        class="watchlist-btn"
                    >
                        <span>★</span>
                        Add to Watchlist
                    </button>

                    <span
                        id="status"
                        class="status"
                    >
                        Loading rates...
                    </span>

                </div>

            </div>


            <!-- Watchlist -->
            <section
                id="watchlist-section"
                class="watchlist-section"
            >

                <div class="section-heading">
                    <h2>Watchlist</h2>

                    <button
                        id="clear-watchlist"
                        class="clear-btn"
                    >
                        Clear
                    </button>
                </div>

                <div
                    id="watchlist"
                    class="watchlist"
                >
                    <!-- JavaScript will render items here -->
                </div>

            </section>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
