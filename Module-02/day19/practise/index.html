<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Addis Market Shopping List</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <h1>Addis Market</h1>

        <p>My Shopping List</p>

        <form id="add-form">

            <div class="form-group">
                <label for="name">Item Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="e.g. Bread"
                >
            </div>

            <div class="form-group">
                <label for="price">Price (ETB)</label>

                <input
                    type="number"
                    id="price"
                    placeholder="e.g. 100"
                    min="0"
                    step="0.01"
                >
            </div>

            <button type="submit">
                Add Item
            </button>

        </form>

        <section class="shopping-section">

            <h2>Shopping List</h2>

            <ul id="list"></ul>

        </section>

        <div class="total">
            <strong>Total:</strong>

            <span id="total">0.00 ETB</span>
        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
