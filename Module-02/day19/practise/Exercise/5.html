<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 5 - Form Events</title>

    <link rel="stylesheet" href="5.css">
</head>

<body>

    <h1>Shopping List</h1>

    <form id="item-form">

        <label for="item-input">
            Item
        </label>

        <input
            type="text"
            id="item-input"
            placeholder="Enter an item"
        >

        <button type="submit">
            Add Item
        </button>

    </form>

    <h2>Items</h2>

    <ul id="item-list"></ul>

    <script src="5.js"></script>

</body>
</html>
