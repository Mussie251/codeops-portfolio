<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Telecom Registration</title>
    <meta name="description" content="Register for Ethio Telecom services.">
</head>
<body>

<header>
    <h1>Ethio Telecom Registration</h1>
</header>

<main>

<!--
POST is used because this form sends personal information
that should not appear in the URL.
-->

<form action="/register" method="post">

    <div>
        <label for="fullname">Full Name</label>
        <input
            type="text"
            id="fullname"
            name="fullname"
            required>
    </div>

    <div>
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required>
    </div>

    <div>
        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+251912345678"
            pattern="\+2519\d{8}"
            required>
    </div>

    <div>
        <label for="branch">Branch</label>

        <select
            id="branch"
            name="branch"
            required>

            <option value="">Choose a Branch</option>
            <option>Bole</option>
            <option>Kazanchis</option>
            <option>Piassa</option>

        </select>

    </div>

    <button type="submit">
        Register
    </button>

</form>

</main>

</body>
</html>
