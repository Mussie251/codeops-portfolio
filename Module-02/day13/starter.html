<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <article class="menu-card">
        <h2 class="menu-title">Doro Wat</h2>

        <p class="description">
            Traditional Ethiopian chicken stew cooked with berbere,
            onions, and served with injera.
        </p>

        <p class="price">350</p>

        <h3>Ingredients</h3>

        <ul class="ingredients">
            <li>Chicken</li>
            <li>Berbere Spice</li>
            <li>Onion</li>
            <li>Garlic</li>
            <li>Boiled Egg</li>
            <li>Injera</li>
        </ul>
    </article>

</body>
</html>
