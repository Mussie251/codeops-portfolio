<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-sclae=1.0">

  </head>
  
  <body>

    <main>
        <h1>Signup Form</h1>

        <form id="signupForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
            >

            <button type="submit">Sign Up</button>

            <p id="error"></p>

        </form>

        <p id="signupCount"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
